# background_image ~/dotfiles/wallpapers/wallhaven-l82kpr.png
# background_image_layout cscaled
# background_image_linear yes
# background_tint 1
exe_search_path +/opt/homebrew/bin/fish
shell /opt/homebrew/bin/fish --login --interactive
# shell /opt/homebrew/bin/fish --profile-startup /tmp/fish.profile
editor nvim
background_blur 0
background_opacity 0.95
startup_session ~/dotfiles/kitty/sessions/home.kitty-session

# transparent_background_colors #181c2c@0.96 #001f00@0.90 #240500@0.90 #103610@0.92 #730000@0.90 #3B4261@0.96

font_size 17.5
font_family      family="CommitMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
modify_font cell_height -2px
modify_font baseline 2
# modify_font cell_width 95%

notify_on_cmd_finish unfocused 20.0

# https://beuke.org/terminal-latency/
# 150 FPS
repaint_delay 8
# Remove artificial input delay
input_delay 0
# turn off vsync
sync_to_monitor no

text_composition_strategy 1.0 0.5
inactive_text_alpha 0.75
clipboard_control write-clipboard write-primary no-append
disable_ligatures cursor

window_title_bar_min_windows 2
window_title_bar_align left

tab_bar_edge top
tab_bar_style separator
tab_separator " ⏐ "
tab_bar_min_tabs 1
tab_bar_filter session:~ or session:^$
tab_title_template "{custom}"

active_tab_foreground   #9ece6a
active_tab_background   #010101
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_font_style bold
inactive_tab_background #010101
tab_bar_background #010101

# Stop kitty shell-integration from changing window/tab titles based on the running command
# This is so that when I open Neovim I don't see that as the tab name
shell_integration no-title

enabled_layouts splits,stack

cursor_blink_interval -1
cursor_shape beam
cursor_trail 20
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
custom_shaders cursor-trail-motion-blur

# Remove all shortcut definitions up to this point.
# Useful, for instance, to remove the default shortcuts.
clear_all_shortcuts yes

kitty_mod cmd

scrollbar scrolled-or-hovered
allow_remote_control socket-only
listen_on unix:/tmp/kitty
# kitty-scrollback.nvim Kitten alias
# action_alias kitty_scrollback_nvim kitten '/Users/dlvhdr/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
# action_alias kitty_scrollback_nvim kitten /Users/dlvhdr/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --nvim-args --clean --noplugin -n
# # Browse scrollback buffer in nvim
# map kitty_mod+shift+f kitty_scrollback_nvim
# # Browse output of the last shell command in nvim
# map kitty_mod+shift+c kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# # Show clicked command output in nvim
# mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# map kitty_mod+f launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay /opt/homebrew/bin/fish -c "KITTY_SCROLLBACK_NVIM=true nvim +'$' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set number relativenumber' +'$' -"
scrollback_pager /bin/zsh -c "KITTY_SCROLLBACK_NVIM=true exec /opt/homebrew/bin/nvim --cmd 'set eventignore=FileType laststatus=0 cmdheight=0 showtabline=0' +'nnoremap q ZQ' +'tnoremap <Esc> <C-\><C-n>' +'call nvim_open_term(0, {})' +'set modifiable number noro relativenumber nolist laststatus=0 cmdheight=0 showtabline=0 noruler' +'autocmd VimEnter * ++once set laststatus=0 cmdheight=0 showtabline=0' +$ +'silent! ?󱝁  ' -c 'call feedkeys(\"\<CR>\")' -"
map kitty_mod+f show_scrollback
map kitty_mod+u show_scrollback
scrollback_fill_enlarged_window yes
scrollback_lines 50000

confirm_os_window_close 0
enable_audio_bell no
allow_remote_control yes
copy_on_select yes
url_style double
window_padding_width 1 5 2 2
window_border_width 4px
hide_window_decorations yes
initial_window_height 400
initial_window_width 640
single_window_margin_width 0
placement_strategy center
remember_window_position true

# macOS stuff
macos_option_as_alt                left
macos_quit_when_last_window_closed yes
macos_show_window_title_in         none
macos_custom_beam_cursor           yes
macos_titlebar_color background
term xterm-kitty

map kitty_mod+v paste_from_clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+r send_text all \x1b\x5b\x41\x0a
map kitty_mod+opt+s noop
map kitty_mod+shift+q quit
# map kitty_mod+z goto_layout stack
map cmd+z next_layout

map kitty_mod+l clear_terminal to_cursor active
map kitty_mod+shift+l clear_terminal scrollback active

# brightness controls
map kitty_mod+b>l set_background_opacity +0.01
map kitty_mod+b>h set_background_opacity -0.01
map kitty_mod+b>1 set_background_opacity 1
map kitty_mod+b>r set_background_opacity default

map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right

# Unset the mapping to pass the keys to neovim
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+l

# the 3 here is the resize amount, adjust as needed
map ctrl+shift+j kitten relative_resize.py down  3
map ctrl+shift+k kitten relative_resize.py up    3
map ctrl+shift+h kitten relative_resize.py left  3
map ctrl+shift+l kitten relative_resize.py right 3

map --when-focus-on var:IS_NVIM ctrl+shift+j
map --when-focus-on var:IS_NVIM ctrl+shift+k
map --when-focus-on var:IS_NVIM ctrl+shift+h
map --when-focus-on var:IS_NVIM ctrl+shift+l

map kitty_mod+u scroll_page_up
map kitty_mod+d scroll_page_down
map --allow-fallback=shifted,ascii kitty_mod+up scroll_to_prompt -1
map --allow-fallback=shifted,ascii kitty_mod+down scroll_to_prompt 1

map kitty_mod+, goto_session $HOME/dotfiles/kitty/sessions/dotfiles.kitty-session

map kitty_mod+w         close_window
map kitty_mod+e         launch --cwd=current --location=vsplit
map kitty_mod+shift+e   launch --cwd=current --location=hsplit

# map kitty_mod+k goto_session $HOME/dotfiles/kitty/sessions
map kitty_mod+k launch --type=background /opt/homebrew/bin/fish '$HOME/dotfiles/kitty/sesh.fish'
map kitty_mod+0x27 goto_session -1
map kitty_mod+t new_tab_with_cwd
map kitty_mod+o open_url_with_hints

action_alias switch_or_launch_tab remote_control_script scripts/launch_or_switch.sh
map kitty_mod+g switch_or_launch_tab --title lazygit --cwd=current fish -c 'lazygit'
# map kitty_mod+g toggle_tab title:lazygit
map kitty_mod+shift+g switch_or_launch_tab --title dash --cwd=current fish -c 'gh dash'

map kitty_mod+9 goto_tab 9
map kitty_mod+8 goto_tab 8
map kitty_mod+7 goto_tab 7
map kitty_mod+6 goto_tab 6
map kitty_mod+5 goto_tab 5
map kitty_mod+4 goto_tab 4
map kitty_mod+3 goto_tab 3
map kitty_mod+2 goto_tab 2
map kitty_mod+1 goto_tab 1
map kitty_mod+; goto_tab -1
map kitty_mod+< move_tab_backward
map kitty_mod+shift+. move_tab_forward

